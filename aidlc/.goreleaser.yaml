version: 2

project_name: aidlc

before:
  hooks:
    - go mod tidy

builds:
  - id: aidlc
    main: ./cmd/aidlc
    binary: aidlc
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/aidlc/ai-dlc-template/aidlc/internal/commands.Version={{ .Version }}

archives:
  - id: aidlc
    ids:
      - aidlc
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

brews:
  - name: aidlc
    repository:
      owner: aidlc
      name: homebrew-tap
    homepage: https://github.com/aidlc/ai-dlc-template
    description: Native CLI for initializing and updating AIDLC governance payloads.
    license: MIT
    install: |
      bin.install "aidlc"
    test: |
      system "#{bin}/aidlc", "version"

release:
  github:
    owner: aidlc
    name: ai-dlc-template

changelog:
  use: github
