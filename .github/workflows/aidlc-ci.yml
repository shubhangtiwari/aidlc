name: aidlc CI

on:
  pull_request:
    paths:
      - "aidlc/**"
      - ".github/workflows/aidlc-ci.yml"
      - ".github/workflows/aidlc-release.yml"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - "aidlc/**"
      - ".github/workflows/aidlc-ci.yml"
      - ".github/workflows/aidlc-release.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aidlc/go.mod
          cache-dependency-path: aidlc/go.sum
      - name: Run aidlc tests
        run: make aidlc-test
      - name: Run aidlc release checks
        run: make aidlc-release-check
